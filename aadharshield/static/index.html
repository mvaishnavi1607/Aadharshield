<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AadharShield Console</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2430;--mut:#6b7686;--line:#e2e6ec;--pri:#0f4c81;--ok:#1a7f4b;--warn:#b26a00;--bad:#b3261e;--side:#14202e}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#18202a;--ink:#e6ebf2;--mut:#93a0b2;--line:#283340;--pri:#5aa2e0;--side:#0b1118}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
#app{display:none;min-height:100vh}aside{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--side);color:#cdd6e2;padding:16px 0}
aside h1{font-size:16px;margin:0 16px 14px;color:#fff}aside a{display:block;padding:9px 16px;color:#cdd6e2;text-decoration:none;cursor:pointer}
aside a.on,aside a:hover{background:rgba(255,255,255,.1);color:#fff}main{margin-left:210px;padding:20px 24px}
.card{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer;background:var(--pri);color:#fff;border-color:var(--pri)}button.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.pill{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line)}.masked{color:var(--ok)}.review{color:var(--warn)}.clean{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.big{font-size:26px;font-weight:700}.mut{color:var(--mut)}
#login{max-width:340px;margin:12vh auto}#login input{width:100%;margin:6px 0}dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:min(460px,92vw)}
dialog textarea,dialog input{width:100%;margin:6px 0}.err{color:var(--bad)}@media(max-width:700px){aside{position:static;width:auto}main{margin:0;padding:12px}}
</style></head><body>
<div id="login" class="card"><h2>AadharShield</h2><div class="mut">Aadhaar masking &amp; controlled unmasking</div>
<input id="u" placeholder="Username" onkeydown="if(event.key=='Enter')login()"><input id="p" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()" style="width:100%">Sign in</button><div id="lerr" class="err"></div></div>
<div id="app"><aside><h1>AadharShield</h1><div id="nav"></div><div style="padding:16px" class="mut" id="who"></div><a onclick="logout()">Sign out</a></aside><main id="main"></main></div>
<dialog id="dlg"><h3>Unmask original</h3><div class="mut" id="dn"></div><textarea id="dr" rows="3" placeholder="Reason (min 15 characters) - recorded in the audit trail"></textarea>
<input id="dt" placeholder="Ticket / reference"><div id="de" class="err"></div><div style="text-align:right"><button class="sec" onclick="dlg.close()">Cancel</button> <button onclick="doUnmask()">Unmask &amp; download</button></div></dialog>
<script>
let T=sessionStorage.getItem('t'),ME=JSON.parse(sessionStorage.getItem('me')||'null'),cur=null,uid=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,o={}){o.headers=Object.assign({Authorization:'Bearer '+T},o.headers||{});const r=await fetch('/api'+p,o);if(r.status==401&&p!='/auth/login'){logout();throw 0}return r}
async function j(p,o){const r=await api(p,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()}
async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});
 if(!r.ok){$('lerr').textContent='Sign-in failed';return}const d=await r.json();T=d.token;ME=d;sessionStorage.setItem('t',T);sessionStorage.setItem('me',JSON.stringify(d));start()}
function logout(){sessionStorage.clear();location.reload()}
const PAGES=[['dash','Dashboard','doc.view'],['docs','Documents','doc.view'],['unmx','Unmask files','unmask.execute'],['fill','Back-fill','job.run'],['unm','Unmask log','unmask.view_log'],['aud','Audit trail','audit.view'],['usr','Users & roles','admin.users'],['set','Settings','admin.settings']];
let FEAT={mask_qr:true,mask_vid:true};
async function start(){try{FEAT=await j('/features')}catch(e){}$('login').style.display='none';$('app').style.display='block';$('who').textContent=ME.username+' · '+ME.role;
 const HIDE={mask:['unmx','unm'],unmask:['fill','docs']}[FEAT.role]||[];const VIS=PAGES.filter(p=>ME.perms.includes(p[2])&&!HIDE.includes(p[0]));
 $('nav').innerHTML=VIS.map(p=>`<a id="n_${p[0]}" onclick="go('${p[0]}')">${p[1]}</a>`).join('');go(VIS[0][0])}
async function go(p){cur=p;document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.id=='n_'+p));try{$('main').innerHTML=await R[p]()}catch(e){$('main').innerHTML='<div class="card err">'+esc(e.message||e)+'</div>'}}
const pill=s=>`<span class="pill ${s}">${s}</span>`;
const R={
async dash(){const s=await j('/stats');if(FEAT.role=='unmask')return `<h2>Dashboard</h2><div class="grid"><div class="card"><div class="mut">Server role</div><div class="big">Unmask</div></div><div class="card"><div class="mut">Encryption key ID</div><div class="big">${FEAT.key_id}</div></div><div class="card"><div class="mut">Vault files indexed</div><div class="big">${s.indexed}</div></div><div class="card"><div class="mut">Unmasks today</div><div class="big">${s.unmask_today}</div></div></div><p class="mut">This server only unmasks. Point it at a vault folder or file written by the masking server (same key) on the Unmask files page.</p>`;
 const jb=await j('/jobs');const t=k=>s.by_status.filter(x=>x.status==k).reduce((a,x)=>a+x.n,0);
 const nums=s.by_status.reduce((a,x)=>a+Number(x.numbers),0),qr=s.by_status.reduce((a,x)=>a+Number(x.qr),0);
 return `<h2>Dashboard</h2><div class="grid"><div class="card"><div class="mut">Masked files</div><div class="big">${t('masked')}</div></div><div class="card"><div class="mut">Needs review</div><div class="big review">${t('review')}</div></div><div class="card"><div class="mut">No Aadhaar found</div><div class="big">${t('clean')}</div></div><div class="card"><div class="mut">Numbers masked</div><div class="big">${nums}</div></div>${FEAT.mask_qr?`<div class="card"><div class="mut">QR codes masked</div><div class="big">${qr}</div></div>`:''}<div class="card"><div class="mut">Unmasks today</div><div class="big">${s.unmask_today}</div></div></div>
 <div class="card"><h3>Recent jobs</h3><table><tr><th>#</th><th>Status</th><th>Total</th><th>Masked</th><th>Clean</th><th>Review</th><th>Failed</th><th>Skipped</th><th>By</th></tr>${jb.map(x=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${x.total}</td><td>${x.masked}</td><td>${x.clean}</td><td>${x.review}</td><td>${x.failed}</td><td>${x.skipped}</td><td>${esc(x.actor)}</td></tr>`).join('')}</table></div>`},
async docs(){const st=window._st||'',q=window._q||'';const d=await j('/documents?limit=200'+(st?'&status='+st:'')+(q?'&q='+encodeURIComponent(q):''));
 const can=ME.perms.includes('unmask.execute');
 return `<h2>Documents <span class="mut">(${d.total})</span></h2><div class="card"><select onchange="window._st=this.value;go('docs')"><option value="">All</option>${['masked','review','clean'].map(s=>`<option ${s==st?'selected':''}>${s}</option>`).join('')}</select> <input placeholder="Search name/path" value="${esc(q)}" onkeydown="if(event.key=='Enter'){window._q=this.value;go('docs')}"></div>
 <div class="card"><table><tr><th>File</th><th>Type</th><th>Status</th><th>Nos.</th>${FEAT.mask_qr?'<th>QR</th>':''}<th>Origin</th><th>Where</th><th></th></tr>${d.items.map(x=>`<tr><td>${esc(x.name)}<div class="mut">${esc(x.source_path||'')}</div></td><td>${x.kind}</td><td>${pill(x.status)}${x.verified?'':' ⚠'}</td><td>${x.numbers}</td>${FEAT.mask_qr?`<td>${x.qr}</td>`:''}<td>${x.origin}</td><td>${x.in_place?'in place':'copy'}</td><td>${x.vaulted?`<button class="sec" onclick="dl('${x.id}')">Masked</button> ${can?`<button onclick="ask('${x.id}','${esc(x.name)}')">Unmask</button>`:''}`:''}</td></tr>`).join('')}</table></div>`},
async fill(){const [jb,st,w]=await Promise.all([j('/jobs'),j('/settings'),j('/watchers')]);const saved=st.backfill_roots||[];
 return `<h2>Back-fill</h2><div class="card"><p class="mut">Mask Aadhaar in files already stored: extracted images, source scan PDFs, Excel/CSV. Originals are encrypted into the vault first. Safe to re-run.</p>
 ${saved.length?`<div style="margin-bottom:6px">Saved folders: ${saved.map(x=>`<button class="sec" onclick="addRoot(this.dataset.p)" data-p="${esc(x)}">${esc(x)}</button>`).join(' ')}</div>`:''}
 <textarea id="roots" rows="3" style="width:100%" placeholder="One folder per line (server path)">${esc(saved.join('\n'))}</textarea><div style="margin:8px 0"><label><input type="radio" name="m" value="copy" checked> Copy (leave originals)</label> &nbsp; <label><input type="radio" name="m" value="inplace"> In place (replace files, originals vaulted)</label></div>
 <input id="man" style="width:100%" placeholder="Optional manifest CSV (extracted_path, source_path, source_page)" value="${esc(st.manifest||'')}"><div style="margin-top:8px"><button onclick="runfill()">Start job</button> <span id="fe" class="err"></span></div></div>
 <div class="card"><h3>Drop-folder watchers</h3><p class="mut">Folders (set in Settings) whose new files are masked in place automatically.</p>${w.length?`<table><tr><th>Folder</th><th>State</th><th>Processed</th><th>Last</th><th></th></tr>${w.map(x=>`<tr><td>${esc(x.folder)}</td><td>${x.running?'<span class="pill masked">running</span>':'stopped'}</td><td>${x.processed}</td><td class="mut">${esc(x.last)}</td><td><button class="sec" onclick="wact('${x.running?'stop':'start'}',this.dataset.p)" data-p="${esc(x.folder)}">${x.running?'Stop':'Start'}</button></td></tr>`).join('')}</table>`:'<div class="mut">No watch folders configured.</div>'}<span id="we" class="err"></span></div>
 <div class="card"><table><tr><th>#</th><th>Status</th><th>Total</th><th>Masked</th><th>Clean</th><th>Review</th><th>Failed</th><th>Skipped</th><th></th></tr>${jb.map(x=>`<tr><td>${x.id}</td><td>${x.status}</td><td>${x.total}</td><td>${x.masked}</td><td>${x.clean}</td><td>${x.review}</td><td>${x.failed}</td><td>${x.skipped}</td><td>${x.status=='running'?`<button class="sec" onclick="api('/jobs/${x.id}/stop',{method:'POST'})">Stop</button>`:''}</td></tr>`).join('')}</table><button class="sec" onclick="go('fill')">Refresh</button></div>`},
async set(){const s=await j('/settings');const L=a=>esc((a||[]).join('\n'));
 return `<h2>Settings</h2><div class="card"><h3>Encryption key</h3><div>Key ID <b>${FEAT.key_id}</b> &nbsp; <span class="mut">server role: ${FEAT.role}. Masking and unmasking servers must show the same Key ID.</span></div></div>
 <div class="card"><h3>Storage folders</h3><p class="mut">Server-side paths. The masked and vault folders must be different and not nested. Existing vault files stay where they were written (their location is recorded per document).</p>
 <label>Masked copies folder</label><div style="display:flex;gap:6px"><input id="s_m" style="flex:1" value="${esc(s.masked_dir)}"><button class="sec" onclick="chk('s_m')">Test</button></div><div id="c_s_m" class="mut"></div>
 <label>Vault folder (encrypted originals)</label><div style="display:flex;gap:6px"><input id="s_v" style="flex:1" value="${esc(s.vault_dir)}"><button class="sec" onclick="chk('s_v')">Test</button></div><div id="c_s_v" class="mut"></div></div>
 <div class="card"><h3>Unmask allowance</h3><label>Default daily unmask limit for new users (files per user per day)</label><br><input id="s_l" type="number" min="0" max="1000" value="${s.default_unmask_limit}" style="width:120px"> <span class="mut">Each user's own limit is edited on the Users page; every released file counts, 0 blocks unmasking.</span></div>
 <div class="card"><h3>What to mask</h3><p class="mut">The first 8 digits of every Aadhaar number are always masked. These options add more.</p><label><input type="checkbox" id="s_q" ${s.mask_qr?'checked':''}> Also mask QR codes (the QR on older Aadhaar letters contains the full number)</label><br><label><input type="checkbox" id="s_i" ${s.mask_vid?'checked':''}> Also mask 16-digit Virtual IDs</label></div>
 <div class="card"><h3>Input folders</h3><label>Saved back-fill folders (one per line)</label><textarea id="s_b" rows="3" style="width:100%">${L(s.backfill_roots)}</textarea>
 <label>Default manifest CSV (optional)</label><div style="display:flex;gap:6px"><input id="s_f" style="flex:1" value="${esc(s.manifest)}"></div>
 <label>Drop-folders to watch (one per line)</label><textarea id="s_w" rows="3" style="width:100%">${L(s.watch_folders)}</textarea>
 <label><input type="checkbox" id="s_e" ${s.watch_enabled?'checked':''}> Start these watchers automatically when the service starts</label><br>
 <label>Allowed roots (optional) - if filled, back-fill and watch folders must sit inside one of these</label><textarea id="s_a" rows="2" style="width:100%">${L(s.allowed_roots)}</textarea>
 <div style="margin-top:8px"><button onclick="chkAll()" class="sec">Test all folders</button> <button onclick="saveSet()">Save settings</button> <span id="se"></span></div><pre id="ck" class="mut"></pre></div>`},
async unmx(){window._sel=new Map();setTimeout(uallow,0);
 return `<h2>Unmask files</h2><div class="mut" id="uallow" style="margin-bottom:8px"></div><div class="card"><h3>0. Vault location</h3><p class="mut">Masking and unmasking can run on different servers. Point this server at a vault folder (or a single .vault file) written by the masking server. Both servers must use the same encryption key.</p><div class="mut" id="vst">Key ID <b>${FEAT.key_id}</b> (must be identical on both servers)</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="vp" placeholder="Vault folder or .vault file, e.g. \\\\maskserver\\vault or D:\\vault" style="flex:1;min-width:240px" onkeydown="if(event.key=='Enter')vscan()"><button onclick="vscan()">Scan</button></div><div id="vres" style="margin-top:8px"></div></div>
 <div class="card"><h3>1. Find the file</h3><p class="mut">Search the files AadharShield has masked by their input folder and/or name, or browse for a masked file on your computer and let the system recognise it. Only files whose original is held in the vault can be unmasked.</p>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><input id="uf" placeholder="Input folder path, e.g. C:\\loans\\kyc" style="flex:2;min-width:220px" onkeydown="if(event.key=='Enter')usearch()"><input id="uq" placeholder="File name contains" style="flex:1;min-width:140px" onkeydown="if(event.key=='Enter')usearch()"><button onclick="usearch()">Search</button></div>
 <div style="margin-top:12px"><span class="mut">Or browse: </span><input type="file" id="ubf" accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.csv,.xlsx,.xlsm"> <button class="sec" onclick="uident()">Identify file</button></div>
 <div id="ures" style="margin-top:12px"></div></div>
 <div class="card"><h3>2. Reason and unmask</h3><div id="usel" class="mut">Nothing selected</div>
 <textarea id="ur" rows="3" style="width:100%;margin-top:6px" placeholder="Reason for unmasking (min ${15} characters) - recorded in the audit trail"></textarea>
 <input id="ut" style="width:100%;margin-top:6px" placeholder="Ticket / reference (optional)">
 <div style="margin-top:8px"><button onclick="udo()">Unmask selected &amp; download</button> <span id="um"></span></div>
 <p class="mut" style="margin-bottom:0">Each unmasked file is logged separately (who, which file, reason, ticket, time, address). Selecting several downloads one zip. Your daily allowance counts every file.</p></div>`},
async unm(){const e=await j('/unmask-events');return `<h2>Unmask log</h2><div class="card"><table><tr><th>When</th><th>User</th><th>Document</th><th>Reason</th><th>Ticket</th><th>IP</th><th>Outcome</th></tr>${e.map(x=>`<tr><td>${x.at.slice(0,19).replace('T',' ')}</td><td>${esc(x.username)}</td><td>${esc(x.name||x.doc_id)}</td><td>${esc(x.reason)}</td><td>${esc(x.ticket)}</td><td>${x.ip}</td><td>${esc(x.outcome)}</td></tr>`).join('')}</table></div>`},
async aud(){const [a,v]=await Promise.all([j('/audit'),j('/audit/verify')]);return `<h2>Audit trail</h2><div class="card">Hash chain: <b class="${v.ok?'masked':'err'}">${v.ok?'intact':'BROKEN at #'+v.broken_at}</b> (${v.checked} entries checked)</div><div class="card"><table><tr><th>#</th><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr>${a.map(x=>`<tr><td>${x.seq}</td><td>${x.at.slice(0,19).replace('T',' ')}</td><td>${esc(x.actor)}</td><td>${x.action}</td><td>${esc(x.target)}</td><td class="mut">${esc(JSON.stringify(x.detail)).slice(0,140)}</td></tr>`).join('')}</table></div>`},
async usr(){const [u,r]=await Promise.all([j('/users'),j('/roles')]);return `<h2>Users &amp; roles</h2><div class="card"><table><tr><th>User</th><th>Role</th><th>Active</th><th>Unmask files per day</th><th>Allowed IPs</th><th></th></tr>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${x.active}</td><td><input type="number" min="0" max="1000" id="lim_${x.username}" value="${x.daily_unmask_limit}" style="width:80px"></td><td><input id="ip_${x.username}" value="${esc(x.allowed_ips)}" placeholder="any" style="width:140px"></td><td style="white-space:nowrap"><button onclick="saveUser('${x.username}')">Save</button> <button class="sec" onclick="tog('${x.username}',${!x.active})">${x.active?'Disable':'Enable'}</button></td></tr>`).join('')}</table></div>
 <div class="card"><h3>Add user</h3><input id="nu" placeholder="username"> <input id="np" type="password" placeholder="password (12+)"> <input id="nl" type="number" min="0" max="1000" placeholder="unmask/day (default)" style="width:150px"> <select id="nr">${r.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select> <button onclick="addu()">Create</button> <span id="ue" class="err"></span></div>
 <div class="card"><h3>Roles → permissions</h3><table>${r.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mut">${(x.perms||[]).filter(Boolean).join(', ')}</td></tr>`).join('')}</table><p class="mut">Permissions are database-driven (PUT /api/roles/{name}).</p></div>`}};
const lines=id=>document.getElementById(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
function addRoot(p){const t=$('roots');const cur=t.value.split('\n').map(x=>x.trim()).filter(Boolean);if(!cur.includes(p))cur.push(p);t.value=cur.join('\n')}
async function chk(id){const p=$(id).value;const r=await j('/settings/check-path',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p,storage:id=='s_m'||id=='s_v'})});
 const out=$('c_'+id);if(out)out.innerHTML=fmtChk(r);return r}
function fmtChk(r){if(r.note&&!r.problems.length)return `<span class="masked">OK</span> - ${esc(r.note)}`;return r.problems.length?`<span class="err">${esc(r.problems.join('; '))}</span>`:`<span class="masked">OK</span> - ${r.supported_files} supported file(s), ${r.writable?'writable':'read-only'}`}
async function chkAll(){let out=[];const st=[$('s_m').value,$('s_v').value];for(const p of [...st,...lines('s_b'),...lines('s_w')]){const r=await j('/settings/check-path',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p,storage:st.includes(p)})});out.push((r.problems.length?'✗ ':'✓ ')+p+' - '+(r.problems.length?r.problems.join('; '):r.note?r.note:r.supported_files+' supported file(s)'+(r.writable?', writable':', read-only')))}$('ck').textContent=out.join('\n')}
async function saveSet(){try{await j('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({masked_dir:$('s_m').value,vault_dir:$('s_v').value,backfill_roots:lines('s_b'),manifest:$('s_f').value,watch_folders:lines('s_w'),watch_enabled:$('s_e').checked,allowed_roots:lines('s_a'),mask_qr:$('s_q').checked,mask_vid:$('s_i').checked,default_unmask_limit:$('s_l').value===''?undefined:Number($('s_l').value)})});FEAT=await j('/features');$('se').innerHTML='<span class="masked">Saved</span>'}catch(e){$('se').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function wact(a,p){try{await j('/watchers/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})});go('fill')}catch(e){$('we').textContent=e.message}}
function ures(rows,note){const t=$('ures');if(!rows.length){t.innerHTML='<div class="mut">'+(note||'No matching files.')+'</div>';return}
 t.innerHTML=(note?`<div class="mut" style="margin-bottom:6px">${note}</div>`:'')+`<table><tr><th></th><th>File</th><th>Type</th><th>Status</th><th>Numbers</th>${FEAT.mask_qr?'<th>QR</th>':''}<th>Where</th></tr>${rows.map(x=>`<tr><td><input type="checkbox" onchange="usel('${x.id}',this.checked,this.dataset.n)" data-n="${esc(x.name)}" ${window._sel.has(x.id)?'checked':''}></td><td>${esc(x.name)}<div class="mut">${esc(x.source_path||'(received by API)')}</div></td><td>${x.kind}</td><td>${pill(x.status)}</td><td>${x.numbers}</td>${FEAT.mask_qr?`<td>${x.qr}</td>`:''}<td>${x.in_place?'in place':'copy'}</td></tr>`).join('')}</table>`}
function usel(id,on,n){on?window._sel.set(id,n):window._sel.delete(id);$('usel').textContent=window._sel.size?window._sel.size+' file(s) selected: '+[...window._sel.values()].slice(0,5).join(', ')+(window._sel.size>5?' ...':''):'Nothing selected'}
async function usearch(){$('um').textContent='';try{const r=await j('/unmask/search?folder='+encodeURIComponent($('uf').value)+'&q='+encodeURIComponent($('uq').value));ures(r,r.length?r.length+' file(s) found':'No file with a held original matches that folder / name.')}catch(e){$('um').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function uident(){const f=$('ubf').files[0];$('um').textContent='';if(!f){$('um').innerHTML='<span class="err">Choose a file first</span>';return}
 const fd=new FormData();fd.append('file',f);try{const r=await j('/unmask/identify',{method:'POST',body:fd});
 r.matches.forEach(m=>{window._sel.set(m.id,m.name)});ures(r.matches,r.matches.length?'Recognised by content ('+r.sha256.slice(0,12)+'...). '+(r.matches.some(m=>m.is_original)?'Note: this file is already the original.':''):'This file is not a masked output held in the vault (never processed here, or changed after masking).');
 if(r.matches.length)usel(r.matches[0].id,true,r.matches[0].name)}catch(e){$('um').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function udo(){if(!window._sel.size){$('um').innerHTML='<span class="err">Select at least one file</span>';return}
 const r=await api('/unmask/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doc_ids:[...window._sel.keys()],reason:$('ur').value,ticket:$('ut').value})});
 if(!r.ok){$('um').innerHTML='<span class="err">'+esc((await r.json()).detail)+'</span>';return}
 const cd=r.headers.get('content-disposition')||'';const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(cd.match(/filename="(.+)"/)||[])[1]||'original';a.click();
 $('um').innerHTML='<span class="masked">Unmasked '+window._sel.size+' file(s) - logged in the unmask log.</span>';window._sel.clear();$('usel').textContent='Nothing selected';uallow()}
async function uallow(){try{const a=await j('/unmask/allowance');const e=$('uallow');if(e)e.innerHTML=`Today's unmask allowance: <b>${a.used}</b> of <b>${a.limit}</b> files used, <b>${a.remaining}</b> left.`}catch(e){}}
async function saveUser(u){if($('lim_'+u).value===''){alert('Enter a limit from 0 to 1000');return}try{await j('/users/'+u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({daily_unmask_limit:Number($('lim_'+u).value),allowed_ips:$('ip_'+u).value})});go('usr')}catch(e){alert(e.message)}}
async function vscan(){const p=$('vp').value.trim();if(!p)return;$('vres').innerHTML='Scanning...';try{const r=await j('/vault/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})});
 const bad=r.wrong_key+r.unreadable;$('vres').innerHTML=`<span class="${bad?'err':'masked'}">${r.found} file(s) found: ${r.indexed} indexed${r.wrong_key?`, ${r.wrong_key} written with a DIFFERENT key`:''}${r.unreadable?`, ${r.unreadable} unreadable`:''}${r.legacy_no_meta?`, ${r.legacy_no_meta} older-format (no index data)`:''}</span>${r.problems.length?'<div class="mut">'+r.problems.map(esc).join('<br>')+'</div>':''}`}catch(e){$('vres').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function dl(id){const r=await api('/documents/'+id+'/masked');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='masked';a.click()}
function ask(id,n){uid=id;$('dn').textContent=n;$('dr').value='';$('dt').value='';$('de').textContent='';dlg.showModal()}
async function doUnmask(){const r=await api('/documents/'+uid+'/unmask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:$('dr').value,ticket:$('dt').value})});
 if(!r.ok){$('de').textContent=(await r.json()).detail;return}const cd=r.headers.get('content-disposition')||'';const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(cd.match(/filename="(.+)"/)||[])[1]||'original';a.click();dlg.close()}
async function runfill(){try{await j('/jobs/backfill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roots:$('roots').value.split('\n').map(s=>s.trim()).filter(Boolean),mode:document.querySelector('input[name=m]:checked').value,manifest:$('man').value||null})});go('fill')}catch(e){$('fe').textContent=e.message}}
async function addu(){try{await j('/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('nu').value,password:$('np').value,role:$('nr').value,daily_unmask_limit:$('nl').value===''?null:Number($('nl').value)})});go('usr')}catch(e){$('ue').textContent=e.message}}
async function tog(u,a){await j('/users/'+u,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:a})});go('usr')}
if(T&&ME)start();
</script></body></html>
